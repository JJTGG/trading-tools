<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Convert currencies using current exchange rates."
    >

    <title>Currency Converter — Trading Tools</title>
</head>

<body class="currency-page">

    <header class="app-header">

        <a href="index.html" class="brand">
            <span class="brand-mark"></span>
            Trading Tools
        </a>

        <nav class="app-nav" aria-label="Application">

            <a href="workspace.html">
                Workspace
            </a>

            <a href="market.html">
                Markets
            </a>

            <a
                href="tools.html"
                class="active"
            >
                Tools
            </a>

        </nav>

        <div class="header-state">

            <span class="header-state-dot"></span>

            <span>
                Currency
            </span>

        </div>

    </header>

    <div
        id="market-strip"
        class="market-strip"
        aria-label="Live market prices"
    >

        <span
            id="market-connection-state"
            class="market-strip-status"
            data-state="connecting"
        >
            Market Data · Connecting
        </span>

        <div id="market-tickers">

            <span class="market-strip-loading">
                Loading markets…
            </span>

        </div>

    </div>

    <main class="public-tool-shell">

        <section class="public-tool-heading">

            <div>

                <p>
                    Tools / Market Conversion
                </p>

                <h1>
                    Currency Converter
                </h1>

                <span>
                    Convert between supported currencies using current exchange rates.
                </span>

            </div>

        </section>

        <section class="currency-workbench">

            <div class="tool-panel">

                <div class="tool-panel-header">

                    <strong>
                        Conversion
                    </strong>

                    <span>
                        Input
                    </span>

                </div>

                <form id="currency-form">

                    <div class="field-group">

                        <label for="currency-amount">
                            Amount
                        </label>

                        <input
                            id="currency-amount"
                            type="number"
                            min="0"
                            step="any"
                            inputmode="decimal"
                            placeholder="100"
                        >

                    </div>

                    <div class="currency-pair">

                        <div class="field-group">

                            <label for="from-currency">
                                From
                            </label>

                            <input
                                id="from-currency"
                                type="text"
                                value="USD"
                                maxlength="3"
                                autocomplete="off"
                            >

                        </div>

                        <div class="currency-arrow">
                            →
                        </div>

                        <div class="field-group">

                            <label for="to-currency">
                                To
                            </label>

                            <input
                                id="to-currency"
                                type="text"
                                value="EUR"
                                maxlength="3"
                                autocomplete="off"
                            >

                        </div>

                    </div>

                    <div class="tool-actions">

                        <button
                            id="convert-currency"
                            type="submit"
                            class="action primary"
                        >
                            Convert
                        </button>

                        <button
                            id="reset-currency"
                            type="button"
                            class="action"
                        >
                            Reset
                        </button>

                    </div>

                </form>

            </div>

            <aside class="tool-panel result-panel">

                <div class="tool-panel-header">

                    <strong>
                        Result
                    </strong>

                    <span>
                        Live response
                    </span>

                </div>

                <div class="currency-result">

                    <span class="result-label">
                        Converted amount
                    </span>

                    <strong id="converted-amount">
                        —
                    </strong>

                </div>

                <dl class="result-details">

                    <div>
                        <dt>
                            Exchange rate
                        </dt>

                        <dd id="currency-rate">
                            —
                        </dd>
                    </div>

                    <div>
                        <dt>
                            Pair
                        </dt>

                        <dd id="currency-pair">
                            —
                        </dd>
                    </div>

                </dl>

                <p
                    id="currency-message"
                    class="tool-message"
                    aria-live="polite"
                ></p>

            </aside>

        </section>

    </main>

    <script
        type="module"
        src="/src/pages/currency.ts"
    ></script>

</body>

</html>
