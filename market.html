<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Track market prices, price changes, and market status with Trading Tools."
    >

    <title>Markets — Trading Tools</title>

    <link rel="stylesheet" href="styles.css">
    <script src="market.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Trading Tools</a>

            <div>
                <a href="index.html">Home</a>
                <a href="tools.html">Tools</a>
                <a href="guide.html">Guide</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>

        <section>
            <p>MARKETS</p>

            <h1>Market Overview</h1>

            <p>
                Check current prices, price changes, and market status
                across supported assets.
            </p>
        </section>

        <section id="market-search">
    <div>
        <label for="market-symbol">Search Market</label>
        <div>
            <input
                id="market-symbol"
                type="text"
                value="AAPL"
                placeholder="Search a company, asset, or symbol"
                autocomplete="off"
            >
            <button id="load-market" type="button">
                Check Market
            </button>
        </div>
    </div>

    <div id="market-suggestions" hidden></div>
</section>

        <section id="market-result" hidden>

            <div>
                <p id="market-name">—</p>
                <span id="market-details">—</span>
            </div>

            <div>
                <strong id="market-price">—</strong>
                <span id="market-change">—</span>
            </div>

            <dl>
                <div>
                    <dt>Symbol</dt>
                    <dd id="market-symbol-result">—</dd>
                </div>

                <div>
                    <dt>Exchange</dt>
                    <dd id="market-exchange">—</dd>
                </div>

                <div>
                    <dt>Currency</dt>
                    <dd id="market-currency">—</dd>
                </div>

                <div>
                    <dt>Market Status</dt>
                    <dd id="market-status">—</dd>
                </div>
            </dl>

        </section>

    </main>

    <footer>
        <p>Trading Tools</p>
        <p>Understand. Calculate. Evaluate. Improve.</p>
    </footer>

</body>
</html>
