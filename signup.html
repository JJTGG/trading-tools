<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Trading Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-panel">
            <a href="index.html" class="auth-brand">Trading Tools</a>

            <div class="auth-header">
                <h1>Create your account</h1>
                <p>Save calculations, build your watchlist, and keep your trading workspace in one place.</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input
                        type="password"
                        id="signup-password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="primary-button">
                    Create account
                </button>

                <p id="signup-message" class="form-message"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="signup.js"></script>
</body>
</html>
